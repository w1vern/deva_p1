x-ai-base: &ai-base
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_started
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy
  volumes:
    - ./cache/hugging_face_cache:/root/.cache/huggingface

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: ${INCLUDE_POSTGRES}

  redis:
    image: redis:7
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      replicas: ${INCLUDE_RABBIT}

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      replicas: ${INCLUDE_MINIO}

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD}; /usr/bin/mc mb myminio/${MINIO_BUCKET}; /usr/bin/mc admin user svcacct add \ --access-key ${MINIO_ACCESS_KEY} \ --secret-key ${MINIO_SECRET_KEY} \ myminio ${MINIO_USER}; exit 0; "
    deploy:
      replicas: ${INCLUDE_MINIO}

  backend:
    build:
      context: ./deva_p1_back
    command: bash -c "uvicorn back.main:app --host 0.0.0.0 --port 8000 --workers ${WORKERS_COUNT}"
    env_file:
      - .env
    depends_on:
      alembic:
        condition: service_started
      postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles:
      - with_back

  frontend:
    build:
      context: ./deva-proj1-front
    env_file:
      - .env
    profiles:
      - with_front

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./logs:/var/log/nginx/
    restart: always
    depends_on:
      frontend:
        condition: service_started
    ports:
      - 80:80
    profiles:
      - with_front

  ai-transcribe-cpu:
    <<: *ai-base
    build:
      context: ./deva_transcript
      dockerfile: Dockerfile.cpu
    environment:
      - TASK_TYPE=transcribe
    profiles:
      - cpu

  ai-transcribe-nvidia:
    <<: *ai-base
    build:
      context: ./deva_transcript
      dockerfile: Dockerfile.nvidia
    environment:
      - TASK_TYPE=transcribe
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    profiles:
      - nvidia

  ai-summary:
    <<: *ai-base
    build:
      context: ./deva_transcript
      dockerfile: Dockerfile.cpu
    environment:
      - TASK_TYPE=summary

  ai-frames_extractor:
    <<: *ai-base
    build:
      context: ./deva_transcript
      dockerfile: Dockerfile.cpu
    environment:
      - TASK_TYPE=frames_extract

  alembic:
    build:
      context: ./deva_p1_back
    command: alembic upgrade head
    restart: "no"
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
